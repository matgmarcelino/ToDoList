<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do App</title>
  </head>
  <body>
    <aside></aside>
    <header></header>
    <main></main>

    <dialog id="projectModal">
      <h3>Project</h3>
      <form id="projectForm">
        <div class="field">
          <label for="projectTitle">Project Title</label>
          <input type="text" id="projectTitle" name="title" />
          <p class="invalid" id="projectFormMessage">This is required!</p>
        </div>
      </form>
      <div class="btn-group">
        <button id="projectModalCreateBtn">Create</button>
        <button id="projectModalCancelBtn">Cancel</button>
      </div>
    </dialog>

    <dialog id="taskModal">
      <h3>Task</h3>
      <form id="taskForm">
        <div class="field">
          <label for="taskTitle">Title</label>
          <input type="text" id="taskTitle" />
          <p class="invalid" id="taskModalTitleMessage">This is required!</p>
        </div>
        <div class="field">
          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate" />
          <p id="taskModalDueDateMessage">This is required!</p>
        </div>
        <div class="field">
          <label for="priority">Priority</label>
          <select name="priority" id="priority" required>
            <option value="none" selected>None</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea
            name="description"
            id="description"
            cols="30"
            rows="10"
          ></textarea>
        </div>
      </form>
      <div class="btn-group">
        <button id="addTaskModalAddBtn">Add</button>
        <button id="addTaskModalCancelBtn">Cancel</button>
      </div>
    </dialog>
  </body>
</html>
